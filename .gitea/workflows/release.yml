name: Release

# GitHub Actions is retired for this repo; releases are cut on Gitea instead.
# One deliberate difference from the old GitHub workflow: the release is created
# with a plain api.github.com call using GH_RELEASE_TOKEN, because
# `secrets.GITHUB_TOKEN` on Gitea resolves to a *Gitea* token and would silently
# target the wrong host. The step skips (does not fail) when the secret is
# absent, so `verify` stays useful on its own.
#
# Runner: ubuntu-latest → Docker mode on jiun-mini (catthehacker/ubuntu:act-latest).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    # Chromium is installed as root but the release gate runs unprivileged, so
    # it cannot live in root's ~/.cache. Pin it somewhere both users can reach.
    env:
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
    steps:
      - name: Checkout exact tagged SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same pinned rendering toolchain as the push workflow; see tests.yml.
      - name: Install YAML validation dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'

      - name: Set up pinned kubectl for kustomize rendering
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.3'

      # GitHub's ubuntu-latest runs jobs as the unprivileged `runner` user;
      # catthehacker/ubuntu under act runs them as root. Several suites here
      # assert that an unreadable directory *stays* unreadable, and root ignores
      # permission bits — so as root those tests either fail outright
      # (ml/model-sync) or self-skip, which the AIR release gate correctly
      # refuses (it allows zero skipped tests). Drop to the image's existing
      # uid 1001 `ubuntu` user for anything that inspects permissions.
      - name: Prepare an unprivileged test user
        run: |
          set -euo pipefail
          id -u ubuntu >/dev/null 2>&1 || useradd -m -u 1001 ubuntu
          install -d -o ubuntu -g ubuntu /tmp/ci-home /tmp/ci-tmp
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"

      - name: Run skill test suites
        run: |
          # A skill owns its tests at <group>/<skill>/tests/test_*.py. Each
          # suite runs from its own skill root so relative script paths resolve.
          set -e
          FOUND=0
          while IFS= read -r dir; do
            FOUND=1
            echo "::group::${dir}"
            (cd "${dir}" && runuser -u ubuntu -- env HOME=/tmp/ci-home TMPDIR=/tmp/ci-tmp PATH="$PATH" python -m unittest discover -s tests -v)
            echo "::endgroup::"
          done < <(find . -mindepth 3 -maxdepth 3 -type d -name tests -not -path "./.git/*" \
                     -exec sh -c 'ls "$1"/test_*.py >/dev/null 2>&1' _ {} \; -print | sed 's|/tests$||' | sort)
          if [ "${FOUND}" -eq 0 ]; then
            echo "no python skill tests found" >&2
            exit 1
          fi

      # catthehacker/ubuntu:act-latest has no ruby, unlike GitHub's
      # ubuntu-latest image. development/appstore-screenshots/tests/run.sh
      # syntax-checks three .rb scripts and runs one pure-ruby test, so a plain
      # interpreter is enough.
      - name: Install ruby for the appstore-screenshots suite
        run: |
          set -euo pipefail
          command -v ruby >/dev/null || {
            apt-get update -qq
            apt-get install -y --no-install-recommends ruby
          }
          ruby --version

      - name: Run hermetic non-Python skill test suites
        shell: bash
        run: |
          set -euo pipefail
          suites=(
            development/appstore-screenshots/tests/run.sh
            development/git-commit-pr/tests/commit-check.test.sh
            development/iac-deploy-prep/tests/test-scripts.sh
            integrations/vault-secrets/tests/security-smoke.sh
            ml/ml-benchmark/tests/ml-benchmark.test.sh
            ml/triton-deploy/tests/test-triton-deploy.sh
            security/security-auditor/tests/test-security-audit.sh
          )

          for suite in "${suites[@]}"; do
            if [[ ! -f "${suite}" ]]; then
              echo "required suite is missing: ${suite}" >&2
              exit 1
            fi
            echo "::group::${suite}"
            runuser -u ubuntu -- env HOME=/tmp/ci-home TMPDIR=/tmp/ci-tmp PATH="$PATH" bash "${suite}"
            echo "::endgroup::"
          done

      - name: Check generated files are current
        run: python common/korean-editor/scripts/build_runtime_rules.py --check

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Install exact browser acceptance dependencies
        working-directory: development/playwright
        run: npm ci --ignore-scripts

      - name: Install acceptance Chromium
        working-directory: development/playwright
        run: |
          ./node_modules/.bin/playwright install --with-deps chromium
          chmod -R a+rX "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Verify AIR source, generated assets, and examples
        env:
          WORKFLOW_STUDIO_PLAYWRIGHT_MODULE: ${{ github.workspace }}/development/playwright/node_modules/playwright-core/index.mjs
        run: |
          runuser -u ubuntu -- env \
            HOME=/tmp/ci-home TMPDIR=/tmp/ci-tmp PATH="$PATH" \
            PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            WORKFLOW_STUDIO_PLAYWRIGHT_MODULE="$WORKFLOW_STUDIO_PLAYWRIGHT_MODULE" \
            node agents/air-workbench/scripts/verify-release.mjs --source

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tagged SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Get version from tag
        id: version
        run: |
          set -euo pipefail
          # workflow_dispatch can target a branch, where GITHUB_REF would not be
          # a tag at all and VERSION would silently become "refs/heads/main".
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Release requires a v* tag; got '$GITHUB_REF'" >&2; exit 1 ;;
          esac
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Count skills
        id: skills
        run: |
          # A skill is exactly <group>/<skill>/SKILL.md. Fixed depth keeps
          # example and fixture SKILL.md files shipped inside a skill from
          # being counted as skills of their own.
          COUNT=$(find . -mindepth 3 -maxdepth 3 -name "SKILL.md" -type f -not -path "./.git/*" | wc -l | tr -d ' ')
          echo "COUNT=$COUNT" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          # 스킬 그룹별 개수
          count_group() {
            find "$1" -mindepth 2 -maxdepth 2 -name "SKILL.md" -type f 2>/dev/null |
              wc -l | tr -d ' '
          }
          AGENTS=$(count_group agents)
          DEVELOPMENT=$(count_group development)
          BUSINESS=$(count_group business)
          INTEGRATIONS=$(count_group integrations)
          ML=$(count_group ml)
          CONTEXT=$(count_group context)
          META=$(count_group meta)
          SECURITY=$(count_group security)
          COMMON=$(count_group common)

          cat << EOF > release_notes.md
          ## agent-skills ${{ steps.version.outputs.VERSION }}

          A modular toolkit for extending AI coding agents.

          ### Quick Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/jiunbae/agent-skills/main/setup.sh | bash -s -- --core --codex
          \`\`\`

          ### Skills (${{ steps.skills.outputs.COUNT }}개)

          | 그룹 | 스킬 수 |
          |------|--------|
          | agents | ${AGENTS} |
          | development | ${DEVELOPMENT} |
          | business | ${BUSINESS} |
          | integrations | ${INTEGRATIONS} |
          | ml | ${ML} |
          | context | ${CONTEXT} |
          | meta | ${META} |
          | security | ${SECURITY} |
          | common | ${COMMON} |

          ### Changes

          See [CHANGELOG](https://github.com/jiunbae/agent-skills/blob/main/CHANGELOG.md) for details.
          EOF

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_RELEASE_TOKEN secret not set on this Gitea repo; skipping GitHub release."
            exit 0
          fi
          REPO="jiunbae/agent-skills"
          TMP="$(mktemp -d)"
          trap 'rm -rf -- "$TMP"' EXIT

          LOOKUP_STATUS="$(curl --silent --show-error --location \
            --output "$TMP/release.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/releases/tags/$VERSION")"
          if [ "$LOOKUP_STATUS" = 200 ]; then
            echo "↩ release $VERSION already exists; nothing to do."
            exit 0
          fi
          if [ "$LOOKUP_STATUS" != 404 ]; then
            echo "GitHub release lookup failed with HTTP $LOOKUP_STATUS" >&2
            jq -r '.message // "Invalid JSON error response"' "$TMP/release.json" >&2 || true
            exit 1
          fi

          # A hyphen in the version marks a pre-release (v1.2.3-rc1).
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac

          PAYLOAD="$(jq -nc \
            --arg tag "$VERSION" \
            --arg name "agent-skills $VERSION" \
            --rawfile body release_notes.md \
            --argjson prerelease "$PRERELEASE" \
            '{tag_name:$tag,name:$name,body:$body,draft:false,
              prerelease:$prerelease,generate_release_notes:true}')"

          CREATE_STATUS="$(curl --silent --show-error --location \
            --output "$TMP/created.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://api.github.com/repos/$REPO/releases")"
          if [ "$CREATE_STATUS" != 201 ]; then
            echo "GitHub release creation failed with HTTP $CREATE_STATUS" >&2
            jq -r '.message // "Invalid JSON error response"' "$TMP/created.json" >&2 || true
            exit 1
          fi
          jq -er '.html_url' "$TMP/created.json"
