name: Tests

# GitHub Actions is retired for this repo. Gitea (jiunbae/agent-skills) mirrors
# GitHub on every push via webhook and runs this on the jiun-mini runner, where
# `ubuntu-latest` maps to catthehacker/ubuntu:act-latest.
#
# `pull_request` is dropped: mirrors are read-only and PRs live on GitHub, so
# `workflow_dispatch` is the only re-run mechanism.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: Python skill tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # validate-k8s.sh renders every overlay and then parses the result, so the
      # suite needs a YAML parser and a kustomize implementation. Both are pinned
      # rather than taken from the runner image: an unpinned kubectl carries
      # whatever kustomize it was built against, and a mismatch fails every
      # overlay build with the tool's error suppressed.
      - name: Install YAML validation dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'

      - name: Set up pinned kubectl for kustomize rendering
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.3'

      # GitHub's ubuntu-latest runs jobs as the unprivileged `runner` user;
      # catthehacker/ubuntu under act runs them as root. Several suites here
      # assert that an unreadable directory *stays* unreadable, and root ignores
      # permission bits — so as root those tests either fail outright
      # (ml/model-sync) or self-skip, which the AIR release gate correctly
      # refuses (it allows zero skipped tests). Drop to the image's existing
      # uid 1001 `ubuntu` user for anything that inspects permissions.
      - name: Prepare an unprivileged test user
        run: |
          set -euo pipefail
          id -u ubuntu >/dev/null 2>&1 || useradd -m -u 1001 ubuntu
          install -d -o ubuntu -g ubuntu /tmp/ci-home /tmp/ci-tmp
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"

      - name: Run skill test suites
        run: |
          # A skill owns its tests at <group>/<skill>/tests/test_*.py. Each
          # suite runs from its own skill root so relative script paths resolve.
          set -e
          FOUND=0
          while IFS= read -r dir; do
            FOUND=1
            echo "::group::${dir}"
            (cd "${dir}" && runuser -u ubuntu -- env HOME=/tmp/ci-home TMPDIR=/tmp/ci-tmp PATH="$PATH" python -m unittest discover -s tests -v)
            echo "::endgroup::"
          done < <(find . -mindepth 3 -maxdepth 3 -type d -name tests -not -path "./.git/*" \
                     -exec sh -c 'ls "$1"/test_*.py >/dev/null 2>&1' _ {} \; -print | sed 's|/tests$||' | sort)
          if [ "${FOUND}" -eq 0 ]; then
            echo "no python skill tests found" >&2
            exit 1
          fi

      # catthehacker/ubuntu:act-latest has no ruby, unlike GitHub's
      # ubuntu-latest image. development/appstore-screenshots/tests/run.sh
      # syntax-checks three .rb scripts and runs one pure-ruby test, so a plain
      # interpreter is enough.
      - name: Install ruby for the appstore-screenshots suite
        run: |
          set -euo pipefail
          if command -v ruby >/dev/null; then
            ruby --version
            exit 0
          fi

          # The runner host corrupts bytes in transit intermittently. It has
          # shown up three separate ways, each caught by a different integrity
          # check: `bad record mac` on a curl download (dark-labyrinth), `tls:
          # bad record MAC` inside buildkit (clawdia), and here as apt
          # `Hash Sum mismatch` on an index whose filesize matched exactly.
          # Re-fetching the same index four times afterwards returned the
          # correct hash every time, so it is intermittent rather than a stale
          # mirror. Nothing in a workflow fixes the host; retry around it.
          for attempt in 1 2 3 4; do
            if apt-get -o Acquire::Retries=3 update -qq && \
               apt-get -o Acquire::Retries=3 install -y --no-install-recommends ruby; then
              ruby --version
              exit 0
            fi
            echo "attempt $attempt to install ruby failed; clearing the apt lists and retrying in $((attempt * 10))s" >&2
            # A mismatched index is cached on disk, so a plain retry re-reads the
            # bad copy. Drop the lists so the next attempt refetches.
            rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 10))
          done
          echo "gave up installing ruby after 4 attempts" >&2
          exit 1

      - name: Run hermetic non-Python skill test suites
        shell: bash
        run: |
          set -euo pipefail
          suites=(
            development/appstore-screenshots/tests/run.sh
            development/git-commit-pr/tests/commit-check.test.sh
            development/iac-deploy-prep/tests/test-scripts.sh
            integrations/vault-secrets/tests/security-smoke.sh
            ml/ml-benchmark/tests/ml-benchmark.test.sh
            ml/triton-deploy/tests/test-triton-deploy.sh
            security/security-auditor/tests/test-security-audit.sh
          )

          for suite in "${suites[@]}"; do
            if [[ ! -f "${suite}" ]]; then
              echo "required suite is missing: ${suite}" >&2
              exit 1
            fi
            echo "::group::${suite}"
            runuser -u ubuntu -- env HOME=/tmp/ci-home TMPDIR=/tmp/ci-tmp PATH="$PATH" bash "${suite}"
            echo "::endgroup::"
          done

      - name: Check generated files are current
        run: |
          # Generated rulebooks drift silently when the canonical source
          # changes without a rebuild, so the check gates every push.
          python common/korean-editor/scripts/build_runtime_rules.py --check

  air:
    name: AIR source release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chromium is installed as root but the release gate runs unprivileged, so
    # it cannot live in root's ~/.cache. Pin it somewhere both users can reach.
    env:
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Install exact browser acceptance dependencies
        working-directory: development/playwright
        run: npm ci --ignore-scripts

      - name: Install acceptance Chromium
        working-directory: development/playwright
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # GitHub's ubuntu-latest runs jobs as the unprivileged `runner` user;
      # catthehacker/ubuntu under act runs them as root. Several suites here
      # assert that an unreadable directory *stays* unreadable, and root ignores
      # permission bits — so as root those tests either fail outright
      # (ml/model-sync) or self-skip, which the AIR release gate correctly
      # refuses (it allows zero skipped tests). Drop to the image's existing
      # uid 1001 `ubuntu` user for anything that inspects permissions.
      - name: Prepare an unprivileged test user
        run: |
          set -euo pipefail
          id -u ubuntu >/dev/null 2>&1 || useradd -m -u 1001 ubuntu
          install -d -o ubuntu -g ubuntu /tmp/ci-home /tmp/ci-tmp
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"
          chmod -R a+rX "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Verify AIR source, generated assets, and examples
        env:
          WORKFLOW_STUDIO_PLAYWRIGHT_MODULE: ${{ github.workspace }}/development/playwright/node_modules/playwright-core/index.mjs
        run: |
          runuser -u ubuntu -- env \
            HOME=/tmp/ci-home TMPDIR=/tmp/ci-tmp PATH="$PATH" \
            PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            WORKFLOW_STUDIO_PLAYWRIGHT_MODULE="$WORKFLOW_STUDIO_PLAYWRIGHT_MODULE" \
            node agents/air-workbench/scripts/verify-release.mjs --source
